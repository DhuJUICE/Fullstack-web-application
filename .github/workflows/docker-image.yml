name: CI/CD Pipeline

on:
  push:
    branches:
      - DEVELOPMENT
  pull_request:
    branches:
      - DEVELOPMENT


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
      - name: Set up Buildx
        run: |
          docker buildx create --use

      - name: Build and push Docker image
        run: |
          docker buildx build --push -t juicebout01/docker-repo:docker-image -f .ProjectBackend/Dockerfile .
