<!DOCTYPE html>
<html>
<head>
    <title>Delete FAQ</title>
</head>
<body>
    <h1>Delete FAQ</h1>
    <form action="{% url 'delete_faq' %}" method="POST">
        {% csrf_token %}
        <label for="faq_id">FAQ ID:</label>
        <input type="number" id="faq_id" name="faq_id" required>
        <button type="submit">Delete FAQ</button>
    </form>
</body>
</html>
