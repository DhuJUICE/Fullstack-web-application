{%extends 'base.html'%} {%block body%}
<title>File Storage</title>
<header><center>This is the Upload File page</center></header>

<form action="fileStorage" method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  <table border="1" align="center">
    <tr>
      <td>
        <input type="file" placeholder="Upload File" name="upload_file" />
      </td>
    </tr>
    <tr>
      <td align="center">
        <input type="submit" name="Submit" />
      </td>
    </tr>
  </table>
</form>
{%endblock%}
